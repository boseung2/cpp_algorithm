<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        background-color: #09aa5c;
        width: 500px;
        height: 50px;
        border-color: white;
        border-radius: 8px;
        font-size: 15px;
        color: white;
        padding: 13px 20px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <button>확인</button>
  </body>
  <script>
    document.querySelector("button").addEventListener("click", function () {
      alert("버튼 클릭");
    });
  </script>
</html>
