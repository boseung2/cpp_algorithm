<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox 예제</title>
    <style>
      .container {
        display: flex; /* Flexbox 활성화 */
        justify-content: space-around; /* 가로 방향 정렬: 요소 사이 균등 간격 */
        align-items: center; /* 세로 방향 정렬: 가운데 */
        height: 200px;
        border: 2px solid black;
        margin-bottom: 40px;
      }

      .box {
        width: 100px;
        height: 100px;
        background: steelblue;
        color: white;
        display: flex; /* 내부 텍스트도 가운데 정렬 */
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      /* 두 번째 예시: 세로 배치 */
      .column {
        display: flex;
        flex-direction: column; /* 세로 방향 정렬 */
        justify-content: space-between; /* 위·아래로 간격 분배 */
        align-items: center; /* 가로 가운데 정렬 */
        height: 300px;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <h2>1. 가로 방향 Flexbox</h2>
    <div class="container">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h2>2. 세로 방향 Flexbox</h2>
    <div class="column">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
