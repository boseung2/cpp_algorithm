<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox 정렬 예시</title>
    <style>
      .container {
        display: flex;
        width: 500px;
        height: 150px;
        border: 2px solid black;
        margin-bottom: 30px;
        background: #f8f8f8;
      }

      .box {
        width: 60px;
        height: 60px;
        background: steelblue;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin: 5px;
      }

      h3 {
        margin: 10px 0 5px;
      }
    </style>
  </head>
  <body>
    <h2>justify-content (메인 축 정렬)</h2>

    <h3>flex-start (기본값)</h3>
    <div class="container" style="justify-content: flex-start">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h3>center</h3>
    <div class="container" style="justify-content: center">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h3>flex-end</h3>
    <div class="container" style="justify-content: flex-end">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h3>space-between</h3>
    <div class="container" style="justify-content: space-between">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h3>space-around</h3>
    <div class="container" style="justify-content: space-around">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <h3>space-evenly</h3>
    <div class="container" style="justify-content: space-evenly">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
    </div>

    <hr />

    <h2>align-items (교차 축 정렬)</h2>

    <h3>flex-start</h3>
    <div class="container" style="align-items: flex-start">
      <div class="box" style="height: 40px">A</div>
      <div class="box" style="height: 70px">B</div>
      <div class="box" style="height: 100px">C</div>
    </div>

    <h3>center</h3>
    <div class="container" style="align-items: center">
      <div class="box" style="height: 40px">A</div>
      <div class="box" style="height: 70px">B</div>
      <div class="box" style="height: 100px">C</div>
    </div>

    <h3>flex-end</h3>
    <div class="container" style="align-items: flex-end">
      <div class="box" style="height: 40px">A</div>
      <div class="box" style="height: 70px">B</div>
      <div class="box" style="height: 100px">C</div>
    </div>

    <h3>stretch (기본값)</h3>
    <div class="container" style="align-items: stretch">
      <div class="box" style="height: auto">A</div>
      <div class="box" style="height: auto">B</div>
      <div class="box" style="height: auto">C</div>
    </div>

    <h3>baseline</h3>
    <div class="container" style="align-items: baseline">
      <div class="box" style="height: 40px; font-size: 12px">A</div>
      <div class="box" style="height: 70px; font-size: 24px">B</div>
      <div class="box" style="height: 100px; font-size: 36px">C</div>
    </div>
  </body>
</html>
