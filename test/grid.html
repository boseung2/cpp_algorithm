<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Grid 레이아웃 예시</title>
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: 100px 200px 1fr; /* 첫 번째 100px, 두 번째 200px, 나머지 자동 */
        grid-template-rows: 80px 120px; /* 두 행의 높이 */
        gap: 10px; /* 셀 간 간격 */
        border: 2px solid black;
        padding: 10px;
        background: #f8f8f8;
      }

      .grid-item {
        background: steelblue;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
      }

      /* 특정 아이템 크기 조정 */
      .wide {
        grid-column: 1 / 4; /* 1번째 열부터 3번째 열 끝까지 차지 */
      }
      .tall {
        grid-row: 1 / 3; /* 1번째 행부터 2번째 행 끝까지 차지 */
      }
    </style>
  </head>
  <body>
    <h2>기본 Grid 레이아웃</h2>
    <div class="grid-container">
      <div class="grid-item">1</div>
      <div class="grid-item">2</div>
      <div class="grid-item">3</div>
      <div class="grid-item wide">4 (가로로 3칸)</div>
      <div class="grid-item tall">5 (세로로 2칸)</div>
      <div class="grid-item">6</div>
    </div>
  </body>
</html>
