<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        padding: 10px 20px;
        margin: 10px;
        border: 1px solid #ccc;
        border-radius: 25px;
      }
      #wrapper {
        width: 220px;
        margin: 10px auto;
      }
      .button1 {
        background-color: red;
      }
      .button2 {
        background-color: purple;
      }

      /* ✅ 미디어 쿼리 */
      @media (max-width: 600px) {
        button {
          width: 100%;
          font-size: 18px;
          background-color: orange;
        }
        .button1 {
          background-color: orange;
        }
        .button2 {
          background-color: orange;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <button class="button1">버튼</button>
      <button class="button2">버튼</button>
      <button class="button2">버튼</button>
    </div>
    <div id="wrapper">
      <button class="button1">버튼</button>
      <button class="button2">버튼</button>
      <button class="button2">버튼</button>
    </div>
  </body>
</html>
