<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    button {
      background-color: skyblue;
      border: 0px;
      color: white;
      width: 100px;
      height: 50px;
      border-radius: 10px;
    }
  </style>
  <body>
    <button>버튼</button>
  </body>
  <script>
    document.querySelector("button").addEventListener("click", function () {
      alert("버튼이 클릭됨");
    });
  </script>
</html>
